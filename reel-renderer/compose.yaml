services:
  renderer:
    build:
      context: ..
      dockerfile: reel-renderer/Dockerfile
    restart: unless-stopped
    environment:
      ELOAH_RENDER_TOKEN: ${ELOAH_RENDER_TOKEN:?Set a strong secret}
      ELOAH_ALLOWED_ORIGIN: https://soniacointe-sketch.github.io
      HOST: 0.0.0.0
      PORT: 8765
    ports:
      - "127.0.0.1:8765:8765"
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=600m,mode=1777
