<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toutes mes cartes · ELOAH</title><style>body{margin:0;background:#f5f3ef;color:#292c2a;font:15px/1.55 system-ui}main{max-width:1150px;margin:auto;padding:25px}h1{font:40px Georgia;margin:12px 0}a{color:#68558e}button,input,select{font:inherit;padding:10px;border:1px solid #d9dad5;border-radius:8px;background:#fff}header{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.filters{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.filters input{flex:1;min-width:220px}.card{background:#fffefa;border:1px solid #ddd;border-radius:10px;padding:16px;margin:10px 0}.card strong{display:block;font-size:16px}.detail{color:#69706c;font-size:13px}.tag{display:inline-block;margin:5px 0;background:#eee8f5;border-radius:12px;padding:3px 8px;color:#665189}.stats{font-size:13px;color:#686d6b}#results{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}.card{margin:0}.empty{padding:22px;background:#fff;border-radius:10px}</style><link rel="stylesheet" href="eloah-theme-global.css?v=20261014">
</head><body><main><header><a href="eloah-trello.html">← ELOAH Boards</a><a href="eloah-trello-echeances.html">Échéances</a><a href="eloah-trello-conflits.html">Résoudre les conflits</a><a href="eloah-trello-import.html">Importer Trello</a></header><h1>Toutes mes cartes</h1><p>Retrouve les cartes de tous tes univers au même endroit. Recherche et filtres sans modifier les données.</p><div class="filters"><input id="search" type="search" placeholder="Rechercher une carte, une description…"><select id="board"><option value="">Tous les tableaux</option></select><select id="state"><option value="active">Actives</option><option value="archived">Archivées</option><option value="all">Toutes</option></select><select id="conflicts"><option value="all">Toutes les cartes</option><option value="only">Conflits à vérifier</option></select><select id="sort"><option value="due">Échéances d'abord</option><option value="title">Titre A–Z</option><option value="board">Tableau A–Z</option></select></div><p id="count" class="stats"></p><section id="results" aria-live="polite"></section></main><script>
let data;try{data=JSON.parse(localStorage.getItem('eloah-boards-v1'))}catch(e){}const $=id=>document.getElementById(id);const make=(tag,text,cls)=>{let el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el};
if(data?.boards?.length){data.boards.forEach(b=>{const o=make('option',b.name);o.value=b.id;$('board').append(o)})}else{$('count').textContent='Aucun tableau enregistré dans ce navigateur. Ouvre ELOAH Boards ou importe tes données Trello.'}
function render(){if(!data?.boards?.length)return;const term=$('search').value.toLocaleLowerCase('fr').trim(),bfilter=$('board').value,state=$('state').value,onlyConflicts=$('conflicts').value==='only';let cards=data.boards.flatMap(b=>(b.cards||[]).map(c=>({...c,boardName:b.name,boardId:b.id,listName:(b.lanes||[]).find(l=>l.id===c.lane)?.name||'Sans liste'})));cards=cards.filter(c=>(!onlyConflicts||c.fusionConflict)&&(!bfilter||c.boardId===bfilter)&&(state==='all'||(state==='archived'?!!c.archived:!c.archived))&&(!term||[c.title,c.description,c.tag,c.boardName,c.listName].join(' ').toLocaleLowerCase('fr').includes(term)));const sort=$('sort').value;if(sort==='due')cards.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));else if(sort==='title')cards.sort((a,b)=>a.title.localeCompare(b.title,'fr'));else cards.sort((a,b)=>a.boardName.localeCompare(b.boardName,'fr'));$('count').textContent=cards.length+' carte(s) trouvée(s)';$('results').replaceChildren();for(const c of cards){let item=make('article',undefined,'card');item.append(make('strong',c.title||'Sans titre'));const open=make('a','Ouvrir / modifier cette carte dans ELOAH ↗');open.href='eloah-trello.html?board='+encodeURIComponent(c.boardId)+'&card='+encodeURIComponent(c.id);open.style.cssText='display:inline-block;margin:8px 0;color:#624b91';item.append(open);item.append(make('div',c.boardName+' · '+c.listName,'detail'));if(c.fusionConflict){item.append(make('span','⚠ Conflit à vérifier','tag'));const resolve=make('a','Comparer les versions ↗');resolve.href='eloah-trello-conflits.html?board='+encodeURIComponent(c.boardId)+'&card='+encodeURIComponent(c.id);resolve.style.cssText='display:block;margin:8px 0;font-weight:700';item.append(resolve)}if(c.tag)item.append(make('span',c.tag,'tag'));if(c.due)item.append(make('div','📅 '+c.due,'detail'));if(c.checks?.length)item.append(make('div','☑ '+c.checks.filter(x=>x.done).length+'/'+c.checks.length,'detail'));if(c.description)item.append(make('p',c.description.slice(0,200)+(c.description.length>200?'…':'')));if(c.links?.length){const external=c.links.filter(url=>{try{return new URL(url).hostname!=='trello.com'&&new URL(url).hostname!=='www.trello.com'}catch(e){return false}});for(const url of external){const a=make('a','Ouvrir le document ↗');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.style.cssText='display:block;margin-top:6px';item.append(a)}}$('results').append(item)}if(!cards.length)$('results').append(make('p','Aucune carte ne correspond aux filtres.','empty'))}
['search','board','state','conflicts','sort'].forEach(k=>$(k).addEventListener('input',render));render();
</script></body></html>
