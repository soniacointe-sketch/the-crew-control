<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELOAH Boards · Gestion de projets</title>
<style>
:root{--bg:#f4f2ee;--panel:#fffefa;--ink:#242a28;--muted:#6c716e;--line:#dddeda;--accent:#7560a7;--soft:#eae5f3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;padding:9px 12px;border-radius:9px;color:var(--ink)}button:hover{border-color:var(--accent)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}a{color:inherit}header{padding:17px 25px;border-bottom:1px solid var(--line);background:#fffefa;display:flex;align-items:center;gap:15px;flex-wrap:wrap}header strong{font:27px Georgia,serif;font-weight:400}header small{color:var(--muted)}header .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}main{padding:25px;max-width:1700px;margin:auto}.eyebrow{color:var(--accent);letter-spacing:.18em;font-size:11px;font-weight:700}h1{font:36px Georgia,serif;margin:6px 0}p{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar select,.toolbar input{background:white;border:1px solid var(--line);border-radius:8px;padding:10px;min-height:42px}.toolbar input{flex:1;min-width:180px}.primary{background:var(--ink);color:white}.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding:10px 1px 20px;min-height:55vh}.lane{flex:0 0 295px;background:#e8e7e3;padding:12px;border-radius:13px;max-height:75vh;overflow-y:auto}.lane h2{font-size:15px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}.lane .count{font:12px system-ui;background:#d8d7d3;padding:2px 8px;border-radius:15px}.card{background:#fffefa;border:1px solid #dfdfdb;border-radius:10px;margin:9px 0;padding:12px;box-shadow:0 2px 5px #0000000a;cursor:grab}.card:active{cursor:grabbing}.card h3{font-size:14px;margin:5px 0;font-weight:650}.card .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:#646968;margin-top:9px}.tag{border-radius:12px;background:var(--soft);padding:2px 8px;color:#58457f}.late{color:#aa2634}.lane.dragover{outline:3px dashed var(--accent)}.add{display:block;width:100%;text-align:left;background:transparent;border:0;margin-top:10px}.empty{padding:16px;color:var(--muted);font-size:12px}.addlane{flex:0 0 230px}dialog{border:1px solid var(--line);border-radius:15px;max-width:min(600px,95vw);width:100%;padding:24px;box-shadow:0 24px 80px #0003}dialog::backdrop{background:#16172280}form{display:grid;gap:12px}label{display:grid;gap:5px;font-weight:600}form input,form select,form textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:white}form textarea{min-height:95px;resize:vertical}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.checks{display:grid;gap:6px}.checkrow{display:flex;gap:8px;align-items:center;background:#f5f4f1;padding:6px;border-radius:6px}.checkrow input{width:auto}.checkrow button{margin-left:auto}#notice{font-size:12px;color:var(--muted)}@media(max-width:650px){header,main{padding:14px}.lane{flex-basis:83vw}h1{font-size:30px}.board{min-height:55vh}}
</style></head><body>
<header><strong>ELOAH <span style="color:#7560a7">Boards</span></strong><small>Tableaux de projets</small><div class="right"><a href="mes-univers.html">← Mes univers</a><button id="export">Exporter JSON</button><button id="importBtn">Importer JSON</button><input type="file" id="importFile" accept=".json,application/json" hidden></div></header>
<main><span class="eyebrow">ELOAH · ORGANISATION</span><h1>Mes tableaux</h1><p>Organise tes projets comme dans Trello : cartes, listes, étiquettes, dates, checklists et déplacement entre colonnes. Données enregistrées dans ce navigateur.</p>
<div class="toolbar"><select id="boardSelect" aria-label="Choisir un tableau"></select><button id="newBoard">+ Tableau</button><input id="search" type="search" placeholder="Rechercher une carte…"><button id="newCard" class="primary">+ Nouvelle carte</button></div>
<div id="notice" role="status"></div><section class="board" id="lanes" aria-label="Colonnes du tableau"></section>
</main>
<dialog id="editor"><form method="dialog" id="editForm"><h2 id="dialogTitle">Modifier une carte</h2><label>Titre<input id="title" required maxlength="160"></label><label>Description<textarea id="description"></textarea></label><label>Liste<select id="laneChoice"></select></label><label>Étiquette / priorité<select id="tag"><option value="">Aucune</option><option>Urgent</option><option>Important</option><option>Création</option><option>Administratif</option><option>Publication</option><option>Suivi</option></select></label><label>Échéance<input type="date" id="due"></label><label>Checklist</label><div class="checks" id="checks"></div><div style="display:flex;gap:7px"><input id="checkText" placeholder="Nouvelle étape" style="flex:1"><button id="addCheck" type="button">+ Étape</button></div><div class="actions"><button type="button" id="deleteCard" style="margin-right:auto">Supprimer</button><button type="button" id="cancel">Annuler</button><button class="primary" id="save">Enregistrer</button></div></form></dialog>
<script>
const KEY='eloah-boards-v1';
const seedNames=['ELOAH','The Crew Orchies','Power & Glam','SONIA OS','PARISIS ENGINE','Foi & spiritualité','Sonia Velka','Le Lion Blanc'];
const defaultLanes=['Idées','À faire','En cours','À vérifier','Terminé'];
const uid=()=>globalThis.crypto?.randomUUID?.()||('id-'+Date.now()+'-'+Math.random().toString(36).slice(2));
const fresh=()=>({version:1,active:null,boards:seedNames.map(name=>({id:uid(),name,lanes:defaultLanes.map(n=>({id:uid(),name})),cards:[]}))});
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.boards))data=fresh();if(!data.active||!data.boards.some(b=>b.id===data.active))data.active=data.boards[0].id;
let editing=null,checks=[];
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));$('notice').textContent='Sauvegarde locale effectuée.'}catch(e){$('notice').textContent='Impossible de sauvegarder : stockage saturé ou bloqué.'}};
const board=()=>data.boards.find(b=>b.id===data.active);
const node=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
function render(){const b=board();$('boardSelect').replaceChildren(...data.boards.map(x=>{const o=node('option',null,x.name);o.value=x.id;return o}));$('boardSelect').value=b.id;
const q=$('search').value.trim().toLocaleLowerCase('fr');$('lanes').replaceChildren();
for(const lane of b.lanes){const el=node('div','lane');const h=node('h2',null,lane.name);const items=b.cards.filter(c=>c.lane===lane.id&&(!q||(c.title+' '+c.description+' '+c.tag).toLocaleLowerCase('fr').includes(q)));h.append(node('span','count',String(items.length)));el.append(h);
el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('dragover')});el.addEventListener('dragleave',()=>el.classList.remove('dragover'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('dragover');const c=b.cards.find(c=>c.id===e.dataTransfer.getData('text/plain'));if(c){c.lane=lane.id;save();render()}});
items.forEach(c=>{const item=node('article','card');item.tabIndex=0;item.draggable=true;item.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',c.id));const open=()=>openCard(c.id);item.addEventListener('click',open);item.addEventListener('keydown',e=>{if(e.key==='Enter')open()});if(c.tag)item.append(node('span','tag',c.tag));item.append(node('h3',null,c.title));const meta=node('div','meta');if(c.due){const d=node('span',new Date(c.due+'T12:00:00')<new Date()?'late':'','📅 '+c.due);meta.append(d)}if(c.checks?.length)meta.append(node('span',null,'☑ '+c.checks.filter(x=>x.done).length+'/'+c.checks.length));item.append(meta);el.append(item)});
const add=node('button','add','+ Ajouter une carte');add.onclick=()=>openCard(null,lane.id);el.append(add);$('lanes').append(el)}
const addLane=node('button','addlane','+ Ajouter une liste');addLane.onclick=()=>{const name=prompt('Nom de la nouvelle liste');if(name?.trim()){b.lanes.push({id:uid(),name:name.trim()});save();render()}};$('lanes').append(addLane)}
function renderChecks(){$('checks').replaceChildren();checks.forEach((c,i)=>{const row=node('div','checkrow');const box=node('input');box.type='checkbox';box.checked=c.done;box.onchange=()=>c.done=box.checked;const label=node('span',null,c.text);const del=node('button',null,'×');del.type='button';del.onclick=()=>{checks.splice(i,1);renderChecks()};row.append(box,label,del);$('checks').append(row)})}
function openCard(id,laneId){const b=board(),c=b.cards.find(x=>x.id===id);editing=id;$('dialogTitle').textContent=c?'Modifier la carte':'Nouvelle carte';$('title').value=c?.title||'';$('description').value=c?.description||'';$('due').value=c?.due||'';$('tag').value=c?.tag||'';$('laneChoice').replaceChildren(...b.lanes.map(l=>{const o=node('option',null,l.name);o.value=l.id;return o}));$('laneChoice').value=c?.lane||laneId||b.lanes[0].id;checks=(c?.checks||[]).map(x=>({...x}));renderChecks();$('deleteCard').hidden=!c;$('editor').showModal();$('title').focus()}
$('save').onclick=e=>{e.preventDefault();const title=$('title').value.trim();if(!title){$('title').reportValidity();return}const b=board();const c=b.cards.find(c=>c.id===editing);const values={title,description:$('description').value,lane:$('laneChoice').value,tag:$('tag').value,due:$('due').value,checks};if(c)Object.assign(c,values);else b.cards.push({id:uid(),...values});save();$('editor').close();render()};
$('deleteCard').onclick=()=>{if(!editing||!confirm('Supprimer cette carte ?'))return;board().cards=board().cards.filter(c=>c.id!==editing);save();$('editor').close();render()};
$('cancel').onclick=()=>$('editor').close();$('addCheck').onclick=()=>{const text=$('checkText').value.trim();if(text){checks.push({text,done:false});$('checkText').value='';renderChecks()}};
$('boardSelect').onchange=e=>{data.active=e.target.value;save();render()};$('search').oninput=render;$('newCard').onclick=()=>openCard(null);$('newBoard').onclick=()=>{const name=prompt('Nom du tableau');if(!name?.trim())return;const b={id:uid(),name:name.trim(),lanes:defaultLanes.map(name=>({id:uid(),name})),cards:[]};data.boards.push(b);data.active=b.id;save();render()};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=node('a');a.href=url;a.download='eloah-boards-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const incoming=JSON.parse(await f.text());if(!Array.isArray(incoming.boards)||!incoming.boards.every(b=>typeof b.id==='string'&&typeof b.name==='string'&&Array.isArray(b.lanes)&&Array.isArray(b.cards)))throw Error('Format non reconnu');if(!confirm('Remplacer les tableaux locaux par ceux du fichier ? Pense à exporter les données actuelles.'))return;data=incoming;data.active=data.boards.some(b=>b.id===data.active)?data.active:data.boards[0]?.id;if(!data.active)throw Error('Aucun tableau');save();render()}catch(err){alert('Import impossible : '+err.message)}finally{e.target.value=''}};render();
</script></body></html>
