<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suivi des échéances · ELOAH Boards</title><style>body{margin:0;background:#f5f3ef;color:#252824;font:15px/1.55 system-ui}main{max-width:1080px;margin:auto;padding:28px}h1{font:38px Georgia}a{color:#594888}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.metric,section{background:#fffefa;border:1px solid #deded9;border-radius:12px;padding:18px;margin-top:15px}.metric strong{display:block;font-size:28px}.card{border-top:1px solid #ddd;padding:10px 0}.pill{font-size:12px;color:#7c3660}select{padding:10px;border:1px solid #ddd;border-radius:8px}button{padding:8px 12px}p{color:#646b66}</style></head><body><main><a href="eloah-trello.html">← Mes tableaux ELOAH</a><h1>Suivi des échéances</h1><p>Une vue de tes cartes actives, calculée directement depuis les données ELOAH de cet appareil.</p><label>Tableau <select id="boards"></select></label><div class="metrics" id="metrics"></div><section><h2>Priorités urgentes</h2><div id="urgent"></div></section><section><h2>Cartes en retard</h2><div id="overdue"></div></section><section><h2>Les 7 prochains jours</h2><div id="soon"></div></section><section><h2>Sans date d’échéance</h2><div id="undated"></div></section><p id="status" role="status"></p></main><script>
const $=id=>document.getElementById(id),key='eloah-boards-v1';let data;try{data=JSON.parse(localStorage.getItem(key))}catch(e){}const toDay=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};const today=toDay(new Date()),next=toDay(new Date(Date.now()+7*86400000));
if(!data?.boards?.length){$('status').textContent='Aucune donnée locale. Ouvre ELOAH Boards ou importe tes tableaux Trello depuis ce navigateur.'}else{for(const b of data.boards){const opt=document.createElement('option');opt.value=b.id;opt.textContent=b.name;$('boards').append(opt)}$('boards').value=data.active||data.boards[0].id;$('boards').onchange=render;render()}
function render(){const b=data.boards.find(x=>x.id===$('boards').value),cards=b.cards.filter(c=>!c.archived),done=c=>/terminé|fait|done|objectif atteint/i.test(b.lanes.find(l=>l.id===c.lane)?.name||'');const overdue=cards.filter(c=>c.due&&c.due<today&&!done(c)),soon=cards.filter(c=>c.due&&c.due>=today&&c.due<=next&&!done(c)),undated=cards.filter(c=>!c.due&&!done(c));$('metrics').replaceChildren();[['Cartes actives',cards.length],['Terminées',cards.filter(done).length],['En retard',overdue.length],['Cette semaine',soon.length]].forEach(([label,n])=>{const x=document.createElement('div');x.className='metric';x.textContent=label;const strong=document.createElement('strong');strong.textContent=n;x.append(strong);$('metrics').append(x)});const fill=(id,arr)=>{const area=$(id);area.replaceChildren();if(!arr.length){area.textContent='Aucune carte';return}arr.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).forEach(c=>{const x=document.createElement('div');x.className='card';const title=document.createElement('strong');title.textContent=c.title;const detail=document.createElement('div');detail.className='pill';detail.textContent=(c.due?'Échéance : '+c.due:'Sans échéance')+' · '+(b.lanes.find(l=>l.id===c.lane)?.name||'Liste inconnue');x.append(title,detail);area.append(x)})};fill('urgent',cards.filter(c=>!done(c)&&c.tag==='Urgent'));fill('overdue',overdue);fill('soon',soon);fill('undated',undated)}
</script></body></html>
