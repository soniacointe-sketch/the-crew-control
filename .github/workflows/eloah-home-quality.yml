name: ELOAH home quality
on:
  push:
    branches: [main]
    paths:
      - 'mes-univers.html'
      - 'eloah-accueil-pro.*'
      - 'eloah-accueil-ia.js'
      - 'eloah-cdsqcd-evidence.js'
      - 'eloah-livrable-studio.js'
      - 'eloah-creation-sources.js'
      - 'eloah-auto-sources.js'
      - 'eloah-memoire-univers.js'
      - 'eloah-export-sources.js'
      - 'tests/eloah-cdsqcd.test.js'
      - 'tests/eloah-cdsqcd-studio.test.js'
      - 'tests/eloah-accueil-static-check.py'
      - '.github/workflows/eloah-home-quality.yml'
  pull_request:
    paths:
      - 'mes-univers.html'
      - 'eloah-accueil-pro.*'
      - 'eloah-accueil-ia.js'
      - 'eloah-cdsqcd-evidence.js'
      - 'eloah-livrable-studio.js'
      - 'eloah-creation-sources.js'
      - 'eloah-auto-sources.js'
      - 'eloah-memoire-univers.js'
      - 'eloah-export-sources.js'
      - 'tests/eloah-cdsqcd.test.js'
      - 'tests/eloah-cdsqcd-studio.test.js'
      - 'tests/eloah-accueil-static-check.py'
      - '.github/workflows/eloah-home-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check home links, anchors and read-only script
        run: python tests/eloah-accueil-static-check.py
      - name: Check home assistant syntax
        run: node --check eloah-accueil-ia.js
      - name: Check CDSQCD provenance and source audit
        run: |
          node --check eloah-livrable-studio.js
          node --check eloah-cdsqcd-evidence.js
          node tests/eloah-cdsqcd.test.js
          node tests/eloah-cdsqcd-studio.test.js
