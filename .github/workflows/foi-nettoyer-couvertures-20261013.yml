name: Nettoyer les photos ELOAH Foi sans formes
# Deuxième exécution : le catalogue contient déjà ses images et elles doivent être remplacées.
on:
  push:
    paths:
      - .github/workflows/foi-nettoyer-couvertures-20261013.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eloah-foi-clean-photographs
  cancel-in-progress: false
jobs:
  nettoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les bibliothèques d'image
        run: python -m pip install --quiet pillow beautifulsoup4
      - name: Régénérer les 71 photos sans formes ni lettrage
        run: python scripts/foi_publications_covers.py
      - name: Vérifier que les photos sont produites
        run: |
          test "$(find assets/foi-publications -maxdepth 1 -type f -name 'generated-*.webp' | wc -l)" -eq 71
          python - <<'PY'
          from pathlib import Path
          files=list(Path("assets/foi-publications").glob("generated-*.webp"))
          assert len(files)==71, len(files)
          assert all(x.stat().st_size>10000 for x in files)
          print("71 photographs clean and ready")
          PY
      - name: Publier les photos en préservant les modifications concurrentes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/foi-publications/generated-*.webp
          if git diff --cached --quiet; then
            echo "Already clean; nothing to publish"
            exit 0
          fi
          git commit -m "Nettoyer les 71 photos Foi sans cercles ni titres"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "71 clean photographs published"
              exit 0
            fi
            sleep 3
          done
          echo "Publishing failed after six attempts"
          exit 1
