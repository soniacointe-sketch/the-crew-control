name: Illustrer toutes les publications ELOAH Foi
on:
  push:
    paths:
      - .github/workflows/foi-illustrer-publications-20261013.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: foi-publications-artwork-import
  cancel-in-progress: false
jobs:
  importer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Extraire la dernière version du dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow et BeautifulSoup
        run: python -m pip install --quiet pillow beautifulsoup4
      - name: Produire les couvertures et terminer les chapitres 11 et 12
        env:
          ELOAH_COVER_SHEET: https://at.adobe.com/6YN1HaYDXhDvStzY
          ELOAH_COVER_11: https://at.adobe.com/W1qE4xut0j93k74v
          ELOAH_COVER_12: https://at.adobe.com/rPdmEBXR0mqNp2co
        run: python scripts/foi_publications_covers.py
      - name: Publier les illustrations, en préservant les autres modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/foi-publications/generated-*.webp assets/foi-publications/art-sources/scene-*.webp assets/foi-chapitres/photo-11.webp assets/foi-chapitres/photo-12.webp
          git commit -m "Ajouter 71 illustrations et compléter les photos 11 et 12 pour ELOAH Foi"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "71 illustrations publiées et les deux derniers chapitres importés."
              exit 0
            fi
            sleep 3
          done
          echo "Impossible de publier les nouvelles images après six tentatives."
          exit 1
