name: ELOAH Monitor · sécurité et régression
on:
  push:
    branches: [main]
    paths:
      - 'eloah-monitor.html'
      - 'eloah-monitor-data.js'
      - 'eloah-monitor-control.js'
      - 'eloah-monitor-data.css'
      - 'eloah-monitor-audit.js'
      - 'eloah-monitor-audit.css'
      - 'eloah-monitor-ops.js'
      - 'eloah-monitor-ops.css'
      - 'eloah-monitor-premium.css'
      - '.github/workflows/eloah-monitor-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-unauthorized:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check eloah-monitor-control.js
          node --check eloah-monitor-data.js
          node --check eloah-monitor-audit.js
          node --check eloah-monitor-ops.js
      - name: Verify founder data isolation and assets
        run: |
          python3 - <<'PY'
          import pathlib, re
          html=pathlib.Path('eloah-monitor.html').read_text()
          js=pathlib.Path('eloah-monitor-data.js').read_text()
          required=['eloah-monitor-data.js','eloah-monitor-data.css','eloah-monitor-control.js','eloah-monitor-control.css','eloah-monitor-lab.html','eloah-monitor-audit.js','eloah-monitor-audit.css','eloah-monitor-ops.js','eloah-monitor-ops.css','eloah-monitor-premium.css']
          for path in required:
              assert pathlib.Path(path).is_file(), f'Missing file: {path}'
              assert path in html, f'Missing HTML reference: {path}'
          assert 'id="access"' in html and 'id="app" hidden' in html, 'Access gate missing'
          assert 'data-real="osMissions"' in html
          assert 'data-real="crewMembers"' in html
          assert 'data-real="pgArticles"' in html
          # Premium 3.0 retains working metrics and session gates; no fictional stats.
          assert 'class="premium-hero"' in html
          assert 'class="hero-console"' in html
          assert 'eloah-monitor-premium.css?v=3.0.1' in html
          assert 'Aperçu dynamique' in html
          for keep in ['metric-universes','metric-verified','metric-focus','metric-tools','health-caption']:
              assert html.count(f'id="{keep}"')==1, f"Metric lost or duplicated: {keep}"
          for section in ['monitor-operations','indicateurs-reels','univers','controle','audit-securite','raccourcis']:
              assert html.count(f'id="{section}"')==1, f"Missing/duplicate section {section}"
          assert '100 %' not in html and 'Conforme' not in html, "Do not fabricate compliance claims"
          premium=pathlib.Path('eloah-monitor-premium.css').read_text()
          assert '@media(max-width:720px)' in premium
          assert '@media(max-width:400px)' in premium
          assert 'hero-console .metrics' in premium

          assert 'id="monitor-operations"' in html
          assert 'id="monitor-command"' in html
          assert 'eloah-monitor-ops.js' in html
          assert 'eloah-monitor-ops.css' in html
          ops=pathlib.Path('eloah-monitor-ops.js').read_text()
          assert 'eloah-monitor-focus-v2' in ops
          assert "localStorage.setItem" not in ops and ".from(" not in ops
          assert "SERVICE_ROLE_KEY" not in ops
          for element_id in ['ops-focus','ops-count','ops-signal','ops-check','ops-refresh','ops-command-open','monitor-command-results','monitor-command-input','monitor-command-close']:
              assert f'id="{element_id}"' in html, f"Missing operations DOM element: {element_id}"
          assert 'CONTROLE_HTTP_PUBLIC' in pathlib.Path('eloah-monitor-control.js').read_text()
          assert 'DÉMONSTRATION DE SUPERVISION' not in pathlib.Path('eloah-monitor-control.js').read_text()
          audit=pathlib.Path('eloah-monitor-audit.js').read_text()
          assert 'id="audit-securite"' in html
          assert 'https://api.github.com' in html
          assert 'eloah-monitor-security.yml' in audit and 'pages.yml' in audit
          assert '.from(' not in audit and 'localStorage' not in audit and 'sessionStorage' not in audit
          assert 'SERVICE_ROLE_KEY' not in audit
          audit_ids=set(re.findall(r"\$\('([a-z0-9-]+)'\)", audit))
          missing_audit={key for key in audit_ids if f'id="{key}"' not in html}
          assert not missing_audit, f'Missing audit identifiers: {missing_audit}'
          assert '.from(' not in js, 'Direct database access from public JS is forbidden'
          assert 'SERVICE_ROLE_KEY' not in js, 'Service key name must not be referenced in public JS'
          assert 'sessionStorage.setItem(' not in js and 'localStorage.setItem(' not in js, 'Never persist private metrics'
          assert 'functions/v1/eloah-monitor-founder-metrics' in js
          ids=set(re.findall(r"\$\('#([a-z0-9-]+)'\)", js))
          missing={key for key in ids if f'id="{key}"' not in html}
          assert not missing, f'Missing DOM identifiers: {missing}'
          print('Monitor static checks passed; no customer records copied.')
          PY
      - name: Check unauthenticated requests never get metrics
        shell: bash
        env:
          FN_URL: https://voytsqyorhoveurnguxn.supabase.co/functions/v1/eloah-monitor-founder-metrics
          MONITOR_ORIGIN: https://soniacointe-sketch.github.io
          PUBLIC_KEY: sb_publishable_WrZkFoX6rrC3CLjasrn1VQ_lB4pr6gy
        run: |
          set -euo pipefail
          for mode in missing fake; do
            auth=()
            if [[ "$mode" == "fake" ]]; then
              auth=(-H "Authorization: Bearer this-is-not-a-valid-session-token-1234567")
            fi
            code=$(curl -sS --max-time 20 -o /tmp/eloah-monitor-body -w "%{http_code}" \
              -H "Origin: $MONITOR_ORIGIN" -H "apikey: $PUBLIC_KEY" \
              -H "Content-Type: application/json" "${auth[@]}" \
              -X POST "$FN_URL" --data '{}')
            echo "$mode -> HTTP $code"
            if [[ "$code" != "401" && "$code" != "403" ]]; then
              echo "FAIL: unexpected response to unauthorized call"
              exit 1
            fi
            if grep -Eq '"measures"|"nextEvents"|"crewMembers"|"osMissions"' /tmp/eloah-monitor-body; then
              echo "FAIL: real business metrics leaked in rejected request"
              exit 1
            fi
          done
          echo "Unauthorized requests rejected; no metrics exposed."
      - name: Verify forbidden origin and preflight response
        shell: bash
        env:
          FN_URL: https://voytsqyorhoveurnguxn.supabase.co/functions/v1/eloah-monitor-founder-metrics
          MONITOR_ORIGIN: https://soniacointe-sketch.github.io
          PUBLIC_KEY: sb_publishable_WrZkFoX6rrC3CLjasrn1VQ_lB4pr6gy
        run: |
          set -euo pipefail
          # An unauthorized origin must never receive any metrics, even without credentials.
          status=$(curl -sS --max-time 20 -o /tmp/monitor-forbidden-body -w '%{http_code}' \
            -X POST "$FN_URL" -H "Origin: https://unauthorized.example" \
            -H "Content-Type: application/json" -H "apikey: $PUBLIC_KEY" --data '{}')
          echo "Wrong origin -> HTTP $status"
          [[ "$status" == 403 ]] || exit 1
          ! grep -Eq '"measures"|"nextEvents"' /tmp/monitor-forbidden-body || exit 1

          # Browser preflight must allow ONLY the existing ELOAH origin.
          status=$(curl -sS --max-time 20 -D /tmp/monitor-preflight-headers \
            -o /tmp/monitor-preflight-body -w '%{http_code}' \
            -X OPTIONS "$FN_URL" -H "Origin: $MONITOR_ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,apikey,content-type")
          echo "Allowed preflight -> HTTP $status"
          [[ "$status" == 204 ]] || exit 1
          grep -qiF "access-control-allow-origin: $MONITOR_ORIGIN" /tmp/monitor-preflight-headers || exit 1
          ! grep -Eq '"measures"|"nextEvents"' /tmp/monitor-preflight-body || exit 1
          echo "Origin and preflight checks passed."
