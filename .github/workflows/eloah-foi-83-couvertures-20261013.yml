name: Produire les couvertures ELOAH Foi
on:
  push:
    paths:
      - .github/workflows/eloah-foi-83-couvertures-20261013.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  couvertures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Préparer Pillow et BeautifulSoup
        run: python -m pip install --quiet pillow beautifulsoup4
      - name: Générer les images manquantes
        env:
          COMPOSITE_A: "https://at.adobe.com/1CPA63JyuQB282wO"
          COMPOSITE_B: "https://at.adobe.com/KQhc8Bv9fvHlTCSj"
          COVER11: "https://at.adobe.com/KE6F9VzfZZ3xQFhx"
          COVER12: "https://at.adobe.com/8cOpgm5YwcplY7Vv"
        run: python scripts/eloah_foi_completer_couvertures.py
      - name: Ajouter les couvertures sans écraser les autres modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/foi-publications/dossier-*.webp assets/foi-chapitres/photo-11.webp assets/foi-chapitres/photo-12.webp
          if git diff --cached --quiet; then
            echo "Aucune nouvelle couverture à publier"
            exit 0
          fi
          git commit -m "Ajouter les 83 couvertures illustrées de Foi Publications"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Couvertures publiées."
              exit 0
            fi
            sleep 5
          done
          echo "Échec de publication après cinq essais."
          exit 1
