<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELOAH · Récupérer mon accès</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 0,#5b2455,transparent 50%),#150b19;color:#fbeef7;font:15px/1.65 system-ui;display:grid;place-items:center;padding:20px}main{width:min(480px,100%);background:#291329;border:1px solid #a16b98;border-radius:17px;padding:32px}h1{font:normal 39px Georgia,serif}p{color:#e2c8da}label{display:block;margin-top:23px}input{width:100%;padding:15px;margin-top:8px;background:#160b18;border:1px solid #b47caa;border-radius:9px;color:#fff;font:16px system-ui}button{width:100%;min-height:50px;background:#e2a2ca;color:#251128;border:0;border-radius:9px;font-weight:750;margin-top:19px;cursor:pointer}a{color:#f8c3e6}#status{min-height:46px}</style></head><body><main><small>ELOAH · ACCÈS FONDATRICE</small><h1>Retrouver mon accès</h1><p>Demande un lien pour définir un nouveau mot de passe. Aucun ancien mot de passe nécessaire.</p><form id="recover"><label>Adresse e-mail du compte ELOAH<input id="email" type="email" required autocomplete="email" placeholder="Ton adresse e-mail"></label><button type="submit" id="send">Envoyer mon lien de récupération</button></form><p id="status" role="status" aria-live="polite">Formulaire prêt.</p><a href="eloah-fondatrice.html">← Retour à ELOAH</a></main><script>
document.getElementById('recover').addEventListener('submit',async function(ev){ev.preventDefault();const status=document.getElementById('status'),button=document.getElementById('send');status.textContent='Demande envoyée au serveur…';button.disabled=true;try{const destination=location.origin+location.pathname.replace(/eloah-recuperation\.html$/,'eloah-fondatrice.html')+'?type=recovery';const response=await fetch('https://voytsqyorhoveurnguxn.supabase.co/auth/v1/recover?redirect_to='+encodeURIComponent(destination),{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_WrZkFoX6rrC3CLjasrn1VQ_lB4pr6gy'},body:JSON.stringify({email:document.getElementById('email').value.trim()})});const body=await response.json().catch(()=>({}));if(!response.ok)throw Error(body.msg||body.error_description||body.message||('Code '+response.status));status.textContent='Demande acceptée par Supabase. Vérifie ta boîte e-mail et les indésirables. La réception reste à confirmer.'}catch(e){status.textContent='Échec de la demande : '+(e.message||'erreur réseau')}finally{button.disabled=false}});
</script></body></html>
