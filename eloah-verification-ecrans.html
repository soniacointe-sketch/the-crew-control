<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELOAH · Vérification des écrans</title><style>*{box-sizing:border-box}body{margin:0;background:#e3e5e1;font:14px system-ui;color:#303530}header{padding:12px;background:white;display:flex;align-items:center;gap:12px;flex-wrap:wrap}select,button,a{font:inherit;padding:10px}main{overflow:auto;padding:16px}iframe{display:block;border:1px solid #adb3a9;margin:auto;background:white;width:390px;height:844px;max-width:none}p{margin:0}output{padding:8px}</style><header><a href="mes-univers.html">Accueil ELOAH</a><label>Écran <select id="page"><option value="mes-univers.html">Accueil</option><option value="eloah-actions.html">Centre d’actions</option><option value="eloah-projet.html?projet=Verification-interface">Projet de vérification</option><option value="maia-control.html">MAIA · Notes</option><option value="eloah-maia.html">MAIA · Tableau de bord</option><option value="power-glam-control.html">Power & Glam</option><option value="eloah-the-crew.html">The Crew Orchies</option><option value="eloah-partenaire.html">Notes & préparation</option><option value="eloah-bibliotheque.html">Documents</option><option value="eloah-pilotage.html">Planning</option><option value="sonia-os.html">SONIA OS</option><option value="index.html">Gestion The Crew</option></select></label><label>Largeur <select id="width"><option>320</option><option selected>390</option><option>768</option><option>1280</option></select></label><button id="check">Vérifier la largeur</button><output id="result" aria-live="polite"></output><p>Aperçu responsive dans un cadre de navigateur ; ne remplace pas un essai sur un téléphone réel.</p></header><main><iframe id="preview" title="Écran ELOAH à vérifier" src="mes-univers.html"></iframe></main><script>
const frame=document.getElementById('preview'),page=document.getElementById('page'),width=document.getElementById('width'),result=document.getElementById('result');
page.onchange=()=>{const url=new URL(page.value,location.href);url.searchParams.set('review',Date.now());frame.src=url.href;result.textContent='Chargement…'};
width.onchange=()=>{frame.style.width=width.value+'px';result.textContent='Largeur réglée à '+width.value+' px'};
function check(){try{const d=frame.contentDocument;result.textContent=d.documentElement.scrollWidth>d.documentElement.clientWidth?'Débordement horizontal : '+d.documentElement.scrollWidth+' / '+d.documentElement.clientWidth+' px':'Aucun débordement horizontal · '+d.documentElement.clientWidth+' px'}catch{result.textContent='Vérification indisponible'}}
document.getElementById('check').onclick=check;frame.onload=check;
</script><script defer src="eloah-navigation.js?v=7"></script></html>
