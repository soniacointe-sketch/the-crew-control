<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copies de secours · ELOAH Boards</title><style>body{margin:0;background:#f5f3ef;color:#282b29;font:15px/1.6 system-ui}main{max-width:900px;margin:35px auto;padding:22px}h1{font:38px Georgia}a{color:#6e58a0}.item{background:#fffefa;border:1px solid #ddd;border-radius:12px;padding:18px;margin:12px 0}button{border:1px solid #ddd;border-radius:8px;padding:10px 14px;background:white;cursor:pointer;margin-right:7px}button.primary{background:#292e2b;color:white}small{color:#69706b}#status{min-height:25px}</style></head><body><main><a href="eloah-trello.html">← Retour à ELOAH Boards</a><h1>Mes copies de secours</h1><p>Retrouve les sauvegardes créées sur cet appareil avant les récupérations depuis Supabase. Elles sont conservées dans le navigateur, pas dans le cloud.</p><p><button id="make">Créer une copie maintenant</button><button id="download">Exporter les tableaux actuels</button></p><p id="status" role="status"></p><section id="list"></section></main><script>
const KEY='eloah-boards-v1',PREFIX='eloah-boards-backup-';const $=id=>document.getElementById(id);const today=()=>new Date().toISOString().replace(/[:.]/g,'-');const valid=x=>x&&Array.isArray(x.boards)&&x.boards.every(b=>typeof b.id==='string'&&Array.isArray(b.cards)&&Array.isArray(b.lanes));function current(){const value=JSON.parse(localStorage.getItem(KEY)||'null');if(!valid(value))throw Error('Aucun tableau local valide');return value}
function backup(reason){const payload=current();const key=PREFIX+today();localStorage.setItem(key,JSON.stringify({at:new Date().toISOString(),reason,payload}));prune();return key}
function prune(){const keys=Object.keys(localStorage).filter(x=>x.startsWith(PREFIX)).sort();while(keys.length>8)localStorage.removeItem(keys.shift())}
function download(data,name){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function render(){const area=$('list');area.replaceChildren();const keys=Object.keys(localStorage).filter(x=>x.startsWith(PREFIX)).sort().reverse();if(!keys.length){area.textContent='Aucune copie de secours enregistrée sur cet appareil.';return}keys.forEach(key=>{let entry;try{entry=JSON.parse(localStorage.getItem(key))}catch(e){return}if(!valid(entry?.payload))return;const card=document.createElement('article');card.className='item';const h=document.createElement('strong');h.textContent=new Date(entry.at||0).toLocaleString('fr-FR');card.append(h);const info=document.createElement('p');info.textContent=(entry.reason||'Sauvegarde')+' · '+entry.payload.boards.length+' tableau(x) · '+entry.payload.boards.reduce((n,b)=>n+b.cards.length,0)+' carte(s)';card.append(info);const restore=document.createElement('button');restore.className='primary';restore.textContent='Restaurer';restore.onclick=()=>{if(!confirm('Restaurer cette copie sur cet appareil ? Une nouvelle copie de tes tableaux actuels sera faite avant.'))return;try{backup('Avant restauration locale');localStorage.setItem(KEY,JSON.stringify(entry.payload));$('status').textContent='Restauration locale terminée. Ouvre ELOAH Boards pour consulter les tableaux.';render()}catch(e){$('status').textContent='Restauration interrompue : '+e.message}};const exportBtn=document.createElement('button');exportBtn.textContent='Télécharger';exportBtn.onclick=()=>download(entry.payload,'eloah-sauvegarde-'+key.slice(PREFIX.length)+'.json');card.append(restore,exportBtn);area.append(card)})}
$('make').onclick=()=>{try{backup('Copie manuelle');$('status').textContent='Copie de secours créée.';render()}catch(e){$('status').textContent=e.message}};$('download').onclick=()=>{try{download(current(),'eloah-boards-export.json')}catch(e){$('status').textContent=e.message}};render();
</script></body></html>
