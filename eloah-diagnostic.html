<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#250d22"><title>Diagnostic ELOAH Mobile</title><link rel="manifest" href="eloah.webmanifest"><style>*{box-sizing:border-box}body{background:#160912;color:#fff1fa;font:15px/1.6 system-ui;margin:0;padding:24px}main{max-width:580px;margin:auto}h1{font:42px Georgia,serif}h2{font:24px Georgia,serif}article{padding:17px;margin:12px 0;background:#2b1427;border:1px solid #6e3b62;border-radius:12px}.ok{color:#8ee9b8}.warn{color:#ffd6a2}.bad{color:#ffa5ae}a{color:#f9aada}button{border:0;border-radius:10px;padding:12px 18px;background:#bb328b;color:white;font-weight:700}small{color:#d4b6ca}</style></head><body><main><a href="eloah-installer.html">← Installer ELOAH</a><h1>État de ton application</h1><p>Diagnostic local effectué par ton navigateur. Aucun document personnel n’est lu.</p><div id="results" aria-live="polite"></div><button onclick="location.reload()">Relancer les tests</button><p><small>Un résultat positif ne remplace pas un test sur Android et iPhone. Les icônes PNG restent à publier.</small></p></main><script>(async()=>{const output=document.querySelector('#results');function add(name,ok,detail,warning=false){const a=document.createElement('article');const h=document.createElement('strong');h.className=ok?'ok':warning?'warn':'bad';h.textContent=(ok?'✓ ':warning?'! ':'✕ ')+name;const p=document.createElement('p');p.textContent=detail;a.append(h,p);output.append(a)}add('Connexion sécurisée',location.protocol==='https:',location.protocol==='https:'?'HTTPS actif':'HTTPS nécessaire pour installer une PWA');try{const res=await fetch('eloah.webmanifest',{cache:'no-store'});const m=await res.json();add('Manifeste ELOAH',res.ok&&m.short_name==='ELOAH',res.ok?'Nom : '+m.name+' · Mode : '+m.display:'Le manifeste est inaccessible')}catch(e){add('Manifeste ELOAH',false,'Impossible de charger le manifeste')}try{const r=await fetch('eloah-app-icon.svg',{cache:'no-store'});add('Icône ELOAH',r.ok,r.ok?'Icône SVG disponible':'Icône SVG non trouvée')}catch(e){add('Icône ELOAH',false,'Impossible de charger l’icône')}const app=matchMedia('(display-mode:standalone)').matches||navigator.standalone===true;add('Mode application',app,app?'ELOAH est ouverte en mode application':'ELOAH est ouverte dans le navigateur',!app);if('serviceWorker' in navigator){try{const registration=await navigator.serviceWorker.register('eloah-sw.js',{scope:'/the-crew-control/'});add('Mode hors connexion',!!registration,'Service worker enregistré : '+registration.scope)}catch(e){add('Mode hors connexion',false,'Enregistrement impossible : '+String(e.message||e))}}else add('Mode hors connexion',false,'Ce navigateur ne prend pas en charge les services workers');add('Tests réels Android / iPhone',false,'À effectuer sur chaque appareil, notamment pour l’icône et l’installation.',true)})();</script></body></html>
