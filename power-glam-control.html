(()=>{
const prior=window.render,G={"Image":{"role":"directeur artistique et créateur d’images éditoriales","steps":["Définis une composition unique : sujet principal, point focal, premier plan, arrière-plan et espace négatif. Donne la priorité à une idée visuelle lisible plutôt qu’à une accumulation de symboles.","Précise cadrage, angle de vue, profondeur de champ, lumière, contraste, couleurs et matières. Fais correspondre ces décisions à l’émotion et à l’usage annoncés.","Respecte les dimensions choisies. Préserve des marges pour les textes, les interfaces sociales et une éventuelle découpe. Ne transforme pas un choix de ratio en promesse de dimensions exactes non produites.","Si une personne réelle est demandée, utilise uniquement la référence fournie. Préserve son identité et ses caractéristiques ; n’invente pas un portrait ressemblant. Si aucune photo n’est fournie, signale ce besoin.","Pour une image avec texte, reprends uniquement les mots validés. Limite la quantité et vérifie orthographe, accents, prix et dates. Si nécessaire, propose une composition en deux étapes : image puis typographie."],"output":"Produis une image finale avec l’outil disponible. Ajoute une courte description alternative accessible et indique le format réellement obtenu. Si la génération est indisponible, livre le prompt de production complet et annonce explicitement qu’aucune image n’a été créée.","checks":"Anatomie et mains cohérentes ; objets et perspectives plausibles ; absence de faux logos, de filigranes ajoutés et de texte illisible ; intention lisible sur mobile."},"Carrousel":{"role":"concepteur-rédacteur et directeur artistique de carrousels","steps":["Construis un fil narratif complet au nombre de slides choisi. La couverture pose une tension précise ; le développement apporte une compréhension ; la dernière slide propose une action cohérente.","Attribue une seule idée principale à chaque slide. Varie les rythmes : phrase forte, exemple concret, explication courte, question ou mise en pratique. Évite de répéter la même idée avec des synonymes.","Pour chaque slide, rédige le texte exact prêt à mettre en page et une direction visuelle : hiérarchie, sujet, placement, couleur et espace libre. Adapte la densité à la lecture sur téléphone.","Distingue les faits, les interprétations et les propositions. Les exemples inventés doivent être présentés comme illustrations, jamais comme témoignages réels.","Si les images sont demandées, prépare une série cohérente et produis-les une par une avec les outils disponibles. N’annonce pas un pack ou un fichier Canva éditable qui n’existe pas."],"output":"Une promesse éditoriale en une phrase, puis chaque slide numérotée avec titre, texte exact et consigne visuelle. Ajoute une légende complémentaire, un CTA et une sélection courte de hashtags pertinents. Termine par une liste des éléments réellement produits.","checks":"Nombre de slides conforme ; progression logique ; textes non répétitifs ; lisibilité ; cohérence graphique ; CTA sans pression ni promesse excessive."},"Post réseaux":{"role":"concepteur-rédacteur social media maîtrisant la voix de Sonia","steps":["Pars d’une scène, d’un constat ou d’une question concrète liée au public. L’accroche doit donner envie de lire sans dramatisation artificielle ni promesse trompeuse.","Développe une idée forte avec un exemple, une nuance et une conséquence pratique. Respecte la longueur choisie et les habitudes de lecture du réseau indiqué.","Écris dans une langue parlée soignée : phrases variées, mots simples, transitions naturelles. Évite les slogans empilés, les formules de coaching génériques et les injonctions.","Fais découler l’appel à l’action du contenu : réfléchir, répondre, découvrir une ressource ou réserver si les modalités sont fournies. Ne crée aucun faux lien ni disponibilité.","Propose deux accroches alternatives réellement différentes, sans réécrire inutilement toute la publication."],"output":"Une publication principale prête à relire, deux accroches alternatives, un CTA alternatif et, si utile pour le réseau choisi, quelques hashtags précis. Ajoute une recommandation visuelle courte.","checks":"Voix naturelle ; longueur cohérente ; aucune expérience personnelle inventée ; pas de résultat garanti ; hashtags liés au sujet et non ajoutés par automatisme."},"Article":{"role":"journaliste-rédacteur éditorial et documentaliste","steps":["Clarifie l’angle et la question à laquelle l’article répond. Définis une promesse précise et un titre qui correspond réellement au contenu.","Construis une introduction incarnée, des sections hiérarchisées et une conclusion utile. Chaque section doit apporter un élément nouveau et contribuer à la réponse.","Recherche les faits récents, les chiffres et les affirmations spécialisées lorsque les outils le permettent. Privilégie les sources primaires. Si tu ne peux pas vérifier un élément, nuance-le ou signale-le sans inventer de référence.","Sépare faits établis, analyse et exemples. Ne transforme pas une hypothèse en diagnostic, une anecdote en règle générale ou une corrélation en causalité.","Intègre naturellement le vocabulaire du sujet ; évite la répétition artificielle de mots-clés. Propose des liens internes uniquement si leurs destinations sont connues."],"output":"Titre principal, deux variantes, chapô, article complet à la longueur demandée avec H2/H3, conclusion et CTA. Ajoute une proposition de méta-description, un slug, une direction pour l’image de couverture et les sources effectivement consultées.","checks":"Angle tenu ; transitions ; absence de remplissage ; exactitude des citations et références ; distinction entre conseil général et expertise réglementée ; métadonnées fidèles au texte."},"Newsletter":{"role":"rédacteur de newsletters et stratège de relation éditoriale","steps":["Choisis une seule intention principale conformément au brief : créer du lien, partager une idée, annoncer ou présenter une offre.","Ouvre avec une entrée personnelle sans inventer un vécu de Sonia. Relie cette ouverture à une idée utile pour la lectrice ou le lecteur.","Rédige un corps aéré, des paragraphes courts et un CTA principal identifiable. Le préheader doit compléter l’objet plutôt que le répéter.","Pour une annonce, utilise seulement les modalités fournies. Marque clairement les informations absentes ; n’invente pas de rareté, d’urgence ou de place restante.","Prévois une version texte simple facile à coller dans l’outil de mailing. N’affirme pas que la campagne a été envoyée."],"output":"Trois objets aux angles distincts, un objet recommandé, un préheader, le corps complet, le texte du bouton principal et une signature adaptée. Les liens manquants apparaissent sous forme de champs à compléter.","checks":"Objet fidèle au contenu ; absence de faux suspense ; lecture mobile ; une action principale ; informations commerciales vérifiables ; aucun résultat d’ouverture ou d’envoi inventé."},"Reel / vidéo":{"role":"scénariste, réalisateur et monteur de vidéos courtes","steps":["Construis une ouverture immédiatement compréhensible, un développement rythmé et une conclusion liée à l’action attendue. Adapte la densité à la durée sélectionnée.","Écris des phrases faciles à dire. Estime la durée à partir du débit et prévois des pauses ; indique que le minutage devra être confirmé à la lecture.","Découpe le script en séquences minutées avec plans, action, voix, textes écran et transitions. Favorise des effets justifiés par le propos.","Respecte la mise en scène choisie. Pour un montage de vidéos personnelles, liste les fichiers nécessaires ; n’invente pas avoir visionné ou monté des rushes absents.","Prévois la lisibilité des sous-titres, les zones de sécurité et une version compréhensible sans le son. Pour la musique, décris une intention ou une source autorisée sans garantir des droits non vérifiés."],"output":"Concept, accroche, script oral intégral, découpage minuté, liste des plans à tourner, textes écran, consignes de montage, couverture et légende. Un fichier vidéo seulement si les médias et outils permettent réellement de le produire.","checks":"Durée réaliste ; phrases prononçables ; plans réalisables ; sous-titres lisibles ; pas d’effets gratuits ; livrables distingués des intentions de montage."},"Voix / narration":{"role":"auteur de narration et directeur de voix","steps":["Écris pour l’oreille : phrases fluides, vocabulaire naturel et rythme adapté à l’émotion recherchée. Évite les formulations visuellement élégantes mais difficiles à prononcer.","Prépare une version propre du texte et une version annotée avec respirations, pauses et intentions sobres. N’inclus pas les annotations dans le texte à synthétiser si le moteur les lirait à voix haute.","Estime la durée et précise le débit indicatif. Vérifie les nombres, sigles, noms propres et prononciations importantes.","Utilise une voix autorisée. Ne présente pas une voix synthétique comme la voix réelle de Sonia et ne simule pas un clonage sans référence ni autorisation.","Si un outil de synthèse et une connexion autorisée sont disponibles, produis l’audio ; sinon livre le script prêt à utiliser, sans prétendre qu’un MP3 a été généré."],"output":"Texte propre à copier, version annotée, indications de voix et de rythme, guide de prononciation et durée estimée. Indique clairement si un fichier audio a réellement été créé.","checks":"Naturel à l’oral ; ponctuation adaptée ; durée plausible ; annotations séparées ; aucun fournisseur ou crédit présenté comme connecté sans preuve."},"Offre / produit":{"role":"stratège d’offre et concepteur de produits éditoriaux","steps":["Identifie le public, sa situation de départ, le besoin concret et le bénéfice visé. Distingue ce que l’offre apporte de ce qu’elle ne peut garantir.","Organise le contenu en étapes cohérentes et définis les livrables, l’expérience, le format et les moyens nécessaires.","Sépare les décisions validées des hypothèses. Ne fixe pas comme faits un prix, une durée, une qualification, une disponibilité ou des résultats non fournis.","Rédige une présentation claire : pour qui, pour quoi, contenu, fonctionnement, limites et prochaine étape. Traite les objections légitimes sans manipuler ni culpabiliser.","Adapte le niveau de détail à l’état du projet choisi. Pour une exploration, propose des options ; pour une présentation, livre un texte publiable après validation des éléments manquants."],"output":"Fiche d’offre structurée, contenu détaillé, parcours proposé, texte de présentation, FAQ utile, CTA et liste courte des décisions à valider. Les options de prix éventuelles restent explicitement des hypothèses.","checks":"Bénéfice concret ; faisabilité ; charge de production ; prix et modalités non inventés ; absence de promesses de guérison ou de revenus garantis."},"Planning éditorial":{"role":"responsable éditorial et planificateur de production","steps":["Construis le planning selon la période, la cadence et la répartition choisies. Ne transforme pas un calendrier de 30 jours en 30 publications si la cadence est de deux par semaine.","Varie les angles, les formats et les intentions : lien, pédagogie, conversation, découverte et présentation d’offre lorsque pertinente.","Pour chaque publication, formule un sujet précis et une accroche de travail. Indique le canal, le format, le CTA, les ressources nécessaires et le niveau d’effort.","Prévois la production avant la publication et des déclinaisons utiles d’un même contenu. Respecte la capacité de production exprimée.","Utilise une date de départ uniquement si elle est fournie ou confirmée dans le contexte. Sinon, travaille avec Semaine 1, Jour 1, etc. Ne présente aucun créneau comme optimal sans données."],"output":"Un tableau avec période ou date, univers, sujet, angle, format, canal, objectif, CTA, éléments à préparer et charge estimée. Ajoute une organisation de production réaliste et trois indicateurs à observer, sans chiffres de performance inventés.","checks":"Cadence respectée ; équilibre des sujets ; absence de ider. Si une information empêche réellement la création, demande uniquement ce qui manque. Sinon, avance jusqu’à un résultat complet avec les outils disponibles.\n\n9. RETOUCHE\nSi je demande une modification, conserve les éléments déjà validés et applique la correction à l’ensemble du livrable concerné. Identifie brièvement ce qui a changé.';

<p class="sub">Des plans de travail à adapter. Ajoute seulement ce qui sert ton cap : aucune échéance n’est imposée.</p><div class="priorityGrid">${catalog.map((c,i)=>`<article class="panel"><span class="tag">${c[0]}</span><h3>${c[1]}</h3><p>${c[2]}</p><details><summary>Voir les ${c[3].split('\n').length} étapes</summary><ol>${c[3].split('\n').map(s=>'<li>'+s+'</li>').join('')}</ol></details><div class="row space"><button data-p-model="${i}">Préparer cette priorité ↗</button><a href="#${c[4]}">Espace associé</a></div></article>`).join('')}</div></section><p class="note">Tes priorités sont conservées dans ce navigateur. Utilise Carnet & sauvegarde pour les exporter. Les échéances n’envoient pas de rappel automatique.</p>`;
