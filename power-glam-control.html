function showThread(id){const t=state.threads.find(x=>x.id===id);if(!t)return;workspace(t.title,`<p class="fine">Carnet guidé local · sans réponse d’IA automatique.</p><div class="chatlocal">${t.messages.map(m=>`<div class="bubble ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join('')}</div><label>Ta réflexion<textarea id="threadInput" rows="4"></textarea></label><button class="primary" id="appendThread">Ajouter à ce fil</button>`);$('#appendThread').onclick=()=>{const val=$('#threadInput').value.trim();if(!val)return;t.messages.push({role:'user',text:val});if(save())showThread(id)}}
async function loadPublicPosts(brand){const s=siteList.find(x=>x.brand===brand),target=$('#posts-'+brand);if(!s||!target)return;target.textContent='Lecture des articles publics…';try{const res=await fetch('https://public-api.wordpress.com/rest/v1.1/sites/'+s.id+'/posts/?number=5&fields=ID,title,URL,date',{signal:AbortSignal.timeout(15000)});if(!res.ok)throw Error();const d=await res.json();const plain=h=>new DOMParser().parseFromString(h,'text/html').body.textContent||'';target.innerHTML=(d.posts||[]).map(p=>safeUrl(p.URL)?`<a href="${esc(p.URL)}" target="_blank" rel="noopener noreferrer">${esc(plain(p.title))}<small>${esc(p.date.slice(0,10))}</small></a>`:'').join('')||'Aucun article public retourné.'}catch{target.textContent='Lecture indisponible depuis ce navigateur. Tu peux ouvrir le site ou WordPress ci-dessus.'}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.publicposts)loadPublicPosts(d.publicposts);if(d.lesson!==undefined){const i=Number(d.lesson),l=lessons[i];workspace(l[0],`<div class="coursebody"><span class="tag">PARCOURS · MODULE ${i+1}</span><h3>1. Métaphore · 30 secondes</h3><p>${esc(l[2])}</p><h3>2. Vocabulaire · 2 minutes</h3><p>${esc(l[3])}</p><h3>3. Technique · passage à l’action</h3><p>${esc(l[4])}</p></div><button id="markRead">Marquer comme lu</button>`);$('#markRead').onclick=()=>{state.lessonProgress[i]=true;save();$('#workspaceDialog').close();render()}}if(d.preview){const c=state.contents.find(x=>x.id===d.preview);if(c)workspace('Aperçu du texte',`<span class="tag">${esc(c.universe)} · ${esc(c.format)} · ${esc(c.channel||'')}</span><h2 style="margin:18px 0">${esc(c.title)}</h2><div class="previewpaper">${esc(c.body)}${c.cta?'\n\n'+esc(c.cta):''}</div><p class="fine">Aperçu de lecture, sans reproduction de l’interface du réseau social.</p><div class="checklist">${checklist.map((l,i)=>`<p class="fine">${c['review'+i]==='on'?'✓':'○'} ${l}</p>`).join('')}</div>`)}if(d.creative){openEditor('briefs');$('#fields select[name=kind]').value=d.creative;$('#fields select[name=provider]').value=d.creative==='Voix'?'ElevenLabs':'Nano Banana';$('#fields textarea[name=body]').value=d.creative==='Voix'?'SCRIPT\n\nINTENTION\n\nRYTHME ET PAUSES\n\nPRONONCIATIONS À PRÉCISER':'SUJET\n\nSCÈNE ET COMPOSITION\n\nLUMIÈRE ET MATIÈRES\n\nFORMAT\n\nÉLÉMENTS À ÉVITER'}if(d.program){openEditor('programNotes');$('#fields select[name=kind]').value=d.program;$('#fields input[name=title]').value=d.program;$('#fields textarea[name=body]').value=d.program==='Fiche besoins anonymisée'?'SITUATION ANONYMISÉE\n\nBESOIN EXPRIMÉ\n\nRESSOURCES ET LIMITES\n\nOBJECTIF CHOISI\n\nPROCHAINE ÉTAPE':d.program==='Posture Power & Glam'?'Écouter sans imposer.\nDistinguer faits et interprétations.\nExpliquer sans diagnostiquer.\nRendre le pouvoir de décision.\nProposer une action réaliste.':'INTENTION\n\nPOUR QUI\n\nCE QUE L’ON TRAVAILLE\n\nDÉROULÉ PROPOSÉ\n\nLIMITES ET MODALITÉS À PRÉCISER'}if(d.newthread){const t={id:crypto.randomUUID(),title:d.newthread,date:today(),messages:[{role:'prompt',text:'Qu’as-tu envie de comprendre ou de faire avancer ? Pose tes idées ici, puis choisis une prochaine étape.'}]};state.threads.push(t);save();showThread(t.id)}if(d.thread)showThread(d.thread)});
const finalRender=()=>{render();if(page==='settings'){$('#export').onclick=exportV3;$('#import').onchange=importV3}};
Object.assign(window,{render:finalRender,openEditor,exportData:exportV3,importData:importV3,validImport:validate});window.removeEventListener('hashchange',previous.render);window.addEventListener('hashchange',finalRender);finalRender();
})();
</script></body></html>
