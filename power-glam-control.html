</style></head><body><aside><a class="brand" href="#home">POWER<span>& GLAM</span><small>LE BUREAU DE SONIA</small></a><div class="navlabel">LA MAISON</div><nav id="nav"></nav><div class="sidebottom"><p>Comprendre.<br>Choisir.<br>Rester soi.</p><small>SONIA OS / POWER & GLAM</small></div></aside><main><header><span id="breadcrumb">LA MAISON / AUJOURD’HUI</span><span id="date"></span><span class="private">Saisies locales</span></header><div id="view"></div><footer><span>POWER & GLAM <i>Control</i></span><span id="saveStatus">Données enregistrées dans ce navigateur · export conseillé</span></footer></main><dialog id="editor"><form id="editForm"><div class="sectionhead"><h2 id="modalTitle"></h2><button type="button" class="icon" id="close" aria-label="Fermer">×</button></div><div id="fields"></div><div class="formbuttons"><button type="button" id="cancel">Annuler</button><button class="primary" type="submit">Enregistrer</button></div></form></dialog><div id="toast" role="status"></div><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const defaults={tasks:[{id:'t1',title:'Vérifier le parcours de réservation',detail:'Une heure avec Sonia · page, paiement et prise de rendez-vous',date:'',done:false},{id:'t2',title:'Choisir le prochain contenu à publier',detail:'Une idée, un univers, une action concrète',date:'',done:false},{id:'t3',title:'Organiser les ressources numériques',detail:'Identifier les produits prêts et les éléments à terminer',date:'',done:false}],contents:[],offers:[{id:'o1',title:'Une heure avec Sonia',price:'59',detail:'60 min en visio, synthèse personnalisée et plan d’action sur 7 jours.',status:'À vérifier',url:''},{id:'o2',title:'Sovereign Woman · 5 fonds d’écran',price:'9.90',detail:'Collection numérique des cinq univers. Vérifier la page de vente et la livraison.',status:'À vérifier',url:''}],finance:[],notes:''};

const nav=[['home','01','Aujourd’hui'],['tasks','02','Mes priorités'],['studio','03','Studio éditorial'],['universes','04','Les cinq univers'],['offers','05','Offres & produits'],['calendar','06','Planning'],['finance','07','Recettes & dépenses'],['resources','08','Mes accès'],['settings','09','Carnet & sauvegarde']];
let page='home',query='',filter='',edit=null;const tone=u=>universes.find(x=>x[0]===u)?.[2]||'#d32027';const euro=n=>Number(n).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Paris'});const dateLabel=d=>d?new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'Sans date';

const head=(title,sub,action='')=>`<div class="pagetop"><div><div class="eyebrow" style="color:#a63d57">POWER & GLAM / LE BUREAU</div><h1>${title}</h1><div class="sub">${sub}</div></div>${action}</div>`;
const add=(type,label)=>`<button class="primary" data-add="${type}">+ ${label}</button>`;

const universeCards=()=>`<div class="universes">${universes.map((u,i)=>`<button class="universe" style="--tone:${u[2]}" data-universe="${u[0]}" data-symbol="${u[3]}"><span class="n">0${i+1}</span><b>${u[0]}</b><small>${u[1]}</small></button>`).join('')}</div>`;
function contentCard(c){return `<article class="contentcard" style="--tone:${tone(c.universe)}"><div class="row"><span class="tag">${esc(c.universe)} / ${esc(c.format)}</span><span class="badge">${esc(c.status)}</span></div><h3>${esc(c.title)}</h3><p>${esc(c.body.slice(0,160))}${c.body.length>160?'…':''}</p><div class="row"><small class="sub">${dateLabel(c.date)}</small><button data-edit="contents:${esc(c.id)}">Ouvrir ↗</button></div></article>`}
function render(){page=location.hash.slice(1)||'home';if(!nav.some(n=>n[0]===page))page='home';$('#nav').innerHTML=nav.map(n=>`<a href="#${n[0]}" class="${page===n[0]?'active':''}" ${page===n[0]?'aria-current="page"':''}><span>${n[1]}</span>${n[2]}</a>`).join('');$('#breadcrumb').textContent='LA MAISON / '+nav.find(n=>n[0]===page)[2].toUpperCase();const remaining=state.tasks.filter(t=>!t.done);let html='';
if(page==='home')html=`<section class="hero"><div><div class="eyebrow">VOTRE MAISON. VOTRE MOUVEMENT.</div><h1>Bienvenue, Sonia.<br>On fait avancer quoi ?</h1><p>Tes idées, tes créations, tes décisions.<br>Tout Power & Glam, au même endroit.</p><button class="primary" data-add="contents">Créer un contenu <span class="arrow">↗</span></button></div></section><div class="stats"><div class="stat"><span>Priorités ouvertes</span><b>${remaining.length.toString().padStart(2,'0')}</b><small>Pour avancer à ton rythme</small></div><div class="stat"><span>Contenus en préparation</span><b>${state.contents.filter(c=>c.status!=='Publié').length.toString().padStart(2,'0')}</b><small>Idées, brouillons et prêts</small></div><div class="stat"><span>Offres répertoriées</span><b>${state.offers.length.toString().padStart(2,'0')}</b><small>Ton catalogue de travail</small></div><div class="stat"><span>Ventes synchronisées</span><b>—</b><small>Aucune connexion active</small></div></div><div class="columns"><section><div class="sectionhead"><h2>L’essentiel aujourd’hui</h2><a href="#tasks" class="textbtn">Tout voir ↗</a></div><div class="panel">${remaining.slice(0,3).map(taskRow).join('')||'<p>Tes priorités sont à jour.</p>'}</div></section><section><div class="sectionhead"><h2>Passer à l’action</h2><span class="tag">LE STUDIO</span></div><div class="actions"><button class="action" data-add="contents"><span>Écrire & créer ↗</span><small>Post, article, carrousel, vidéo</small></button><button class="action" data-go="offers"><span>Mes offres ↗</span><small>Coaching et produits numériques</small></button><button class="action" data-add="tasks"><span>Poser une priorité ↗</span><small>Une prochaine étape concrète</small></button><button class="action" data-go="calendar"><span>Voir mon planning ↗</span><small>Publications et échéances</small></button></div></section></div><section class="space"><div class="sectionhead"><h2>Cinq univers. Une même femme.</h2><span class="tag">LA MAISON POWER & GLAM</span></div>${universeCards()}</section>`;
if(page==='tasks')html=head('Mes priorités','Une action claire à la fois.',add('tasks','Ajouter'))+`<div class="panel">${state.tasks.map(taskRow).join('')||'<p>Aucune priorité. Ajoute ta première action.</p>'}</div>`;
if(page==='universes')html=head('Les cinq univers','Entre dans un univers pour retrouver ses contenus.')+universeCards()+`<div class="note">Chaque univers filtre le studio éditorial. Tu peux y créer un contenu et conserver son texte, son format et sa date.</div>`;
if(page==='studio'){html=head('Studio éditorial','De la première idée au contenu publié.',add('contents','Créer'))+`<div class="toolbar"><input id="search" aria-label="Rechercher un contenu" placeholder="Rechercher un titre ou un texte…" value="${esc(query)}"><select id="filter" aria-label="Filtrer par univers"><option value="">Tous les univers</option>${universes.map(u=>`<option ${filter===u[0]?'selected':''}>${u[0]}</option>`).join('')}</select></div><div class="cards" id="contentCards"></div>`}
if(page==='offers')html=head('Offres & produits','Ton catalogue de travail, à compléter et à tenir à jour.',add('offers','Ajouter'))+`<div class="cards">${state.offers.map(o=>`<article class="contentcard"><span class="tag">${esc(o.status)}</span><h3>${esc(o.title)}</h3><div class="money">${o.price?euro(o.price):'Prix à définir'}</div><p>${esc(o.detail)}</p><div class="row"><button data-edit="offers:${esc(o.id)}">Modifier ↗</button>${safeUrl(o.url)?`<a href="${esc(o.url)}" target="_blank" rel="noopener noreferrer">Ouvrir la page</a>`:''}</div></article>`).join('')}</div><div class="note">Les deux offres initiales reprennent les informations déjà partagées. Leurs prix et leurs pages restent à vérifier. Ce catalogue ne crée ni paiement ni page de vente.</div>`;
if(page==='calendar'){const items=[...state.tasks.filter(t=>t.date&&!t.done).map(t=>({...t,type:'tasks',label:'Priorité'})),...state.contents.filter(c=>c.date).map(c=>({...c,type:'contents',label:c.format+' · '+c.status}))].sort((a,b)=>a.date.localeCompare(b.date));html=head('Planning','Les dates que tu as attribuées à tes priorités et à tes contenus.',add('contents','Planifier'))+(items.length?items.map(c=>`<div class="task"><div><small>${dateLabel(c.date)} · ${esc(c.label)}</small><b>${esc(c.title)}</b></div><button data-edit="${c.type}:${esc(c.id)}">Ouvrir ↗</button></div>`).join(''):'<div class="empty">Ton planning est libre.<br>Ajoute une date à un contenu ou à une priorité pour le retrouver ici.</div>')}
if(page==='finance'){const income=state.finance.filter(x=>x.kind==='Recette').reduce((s,x)=>s+Number(x.amount),0),expense=state.finance.filter(x=>x.kind==='Dépense').reduce((s,x)=>s+Number(x.amount),0);html=head('Recettes & dépenses','Suivi manuel des montants que tu saisis.',add('finance','Ajouter une ligne'))+`<div class="stats"><div class="stat"><span>Recettes saisies</span><b>${euro(income)}</b></div><div class="stat"><span>Dépenses saisies</span><b>${euro(expense)}</b></div><div class="stat"><span>Différence saisie</span><b>${euro(income-expense)}</b></div><div class="stat"><span>Origine</span><b>Manuelle</b><small>Aucune synchronisation bancaire</small></div></div><div class="panel">${state.finance.map(x=>`<div class="task"><div><b>${esc(x.title)}</b><small>${dateLabel(x.date)} · ${esc(x.kind)}</small></div><b>${euro(x.amount)}</b><button data-edit="finance:${esc(x.id)}">Modifier</button></div>`).join('')||'<p>Aucune écriture saisie.</p>'}</div><p class="sub">Ces totaux portent uniquement sur tes saisies ; ils ne représentent pas le solde de ton compte.</p>`}
if(page==='resources')html=head('Mes accès','Les portes d’entrée de la Maison.')+`<div class="links"><a class="link" href="https://powerglam1.wordpress.com" target="_blank" rel="noopener">Le site Power & Glam ↗<small>Ouvrir le site public</small></a><a class="link" href="https://wordpress.com/posts/powerglam1.wordpress.com" target="_blank" rel="noopener">Articles WordPress ↗<small>Retrouver et gérer les articles dans WordPress</small></a><a class="link" href="https://wordpress.com/earn/payments/powerglam1.wordpress.com" target="_blank" rel="noopener">Paiements WordPress ↗<small>Ouvrir l’administration des paiements</small></a><a class="link" href="https://www.canva.com/" target="_blank" rel="noopener">Canva ↗<small>Ouvrir ton espace de création</small></a></div><div class="note">Ces accès ouvrent les services concernés. Leurs données ne sont pas importées dans ce tableau de bord.</div>`;

$('#view').innerHTML=html;if(page==='studio'){drawContents();$('#search').oninput=e=>{query=e.target.value;drawContents()};$('#filter').onchange=e=>{filter=e.target.value;drawContents()}}if(page==='settings'){$('#saveNotes').onclick=()=>{state.notes=$('#notes').value;if(save())toast('Carnet enregistré')};$('#export').onclick=exportData;$('#import').onchange=importData}}
function drawContents(){const list=state.contents.filter(c=>(!filter||c.universe===filter)&&(!query||(c.title+' '+c.body).toLowerCase().includes(query.toLowerCase())));$('#contentCards').innerHTML=list.length?list.map(contentCard).join(''):'<div class="empty" style="grid-column:1/-1">Aucun contenu ici pour le moment.<br>Crée ton premier brouillon avec le bouton « Créer ».</div>'}
function safeUrl(u){try{return ['http:','https:'].includes(new URL(u).protocol)}catch{return false}}
const field=(key,label,value='',type='text',required=false)=>`<label>${label}<input name="${key}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="0.01"':''} maxlength="500"></label>`;
const area=(key,label,value='')=>`<label>${label}<textarea name="${key}" maxlength="100000">${esc(value)}</textarea></label>`;
const select=(key,label,values,value)=>`<label>${label}<select name="${key}">${values.map(v=>`<option ${v===value?'selected':''}>${v}</option>`).join('')}</select></label>`;
function openEditor(type,id){const item=state[type].find(x=>x.id===id)||{};edit={type,id};$('#modalTitle').textContent=id?'Modifier':'Créer';let f=field('title','Titre',item.title,'text',true);if(type==='tasks')f+=area('detail','Prochaine étape',item.detail)+field('date','Échéance (facultatif)',item.date,'date');if(type==='contents')f+=select('universe','Univers',universes.map(u=>u[0]),item.universe||filter||'Amour')+select('format','Format',['Post','Article','Carrousel','Story','Reel','Newsletter'],item.format)+select('status','Avancement',['Idée','Brouillon','Prêt','Publié'],item.status)+field('date','Date prévue (facultatif)',item.date,'date')+area('body','Ton texte',item.body);if(type==='offers')f+=field('price','Prix en euros (facultatif)',item.price,'number')+select('status','Statut',['À vérifier','En préparation','Disponible','En pause'],item.status)+area('detail','Description',item.detail)+field('url','Lien de la page (facultatif)',item.url,'url');if(type==='finance')f+=select('kind','Type',['Recette','Dépense'],item.kind)+field('amount','Montant en euros',item.amount,'number',true)+field('date','Date',item.date||today(),'date',true);if(id)f+='<button type="button" id="deleteItem">Supprimer cette fiche</button>';$('#fields').innerHTML=f;$('#editor').showModal();$('#fields input').focus();if(id)$('#deleteItem').onclick=()=>{if(confirm('Supprimer cette fiche ?')){state[type]=state[type].filter(x=>x.id!==id);save();$('#editor').close();render()}}}
$('#editForm').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(!data.title.trim())return;const {type,id}=edit;if(type==='offers'&&data.url&&!safeUrl(data.url)){toast('Utilise un lien https:// ou http://');return}const old=state[type].find(x=>x.id===id);const item={...old,...data,id:id||crypto.randomUUID()};if(type==='tasks'&&!old)item.done=false;if(old)state[type]=state[type].map(x=>x.id===id?item:x);else state[type].push(item);save();$('#editor').close();render();toast('Fiche enregistrée')};$('#close').onclick=$('#cancel').onclick=()=>$('#editor').close();
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.add)openEditor(b.dataset.add);if(b.dataset.edit){const [type,id]=b.dataset.edit.split(':');openEditor(type,id)}if(b.dataset.go)location.hash=b.dataset.go;if(b.dataset.universe){filter=b.dataset.universe;query='';location.hash='studio'}});document.addEventListener('change',e=>{if(e.target.dataset.check){state.tasks.find(t=>t.id===e.target.dataset.check).done=e.target.checked;save();render()}});
function exportData(){const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='power-glam-control-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Sauvegarde exportée')}
function validImport(d){if(!d||typeof d.notes!=='string')return false;for(const key of ['tasks','contents','offers','finance']){if(!Array.isArray(d[key])||d[key].length>10000)return false;const ids=new Set();for(const x of d[key]){if(!x||typeof x.id!=='string'||!x.id||ids.has(x.id)||typeof x.title!=='string')return false;ids.add(x.id);if(key==='tasks'&&(typeof x.detail!=='string'||typeof x.done!=='boolean'||typeof x.date!=='string'))return false;if(key==='contents'&&['body','date','format','status','universe'].some(k=>typeof x[k]!=='string'))return false;if(key==='offers'&&['price','detail','status','url'].some(k=>typeof x[k]!=='string'))return false;if(key==='finance'&&(!['Recette','Dépense'].includes(x.kind)||!Number.isFinite(Number(x.amount))||Number(x.amount)<0||typeof x.date!=='string'))return false}}return true}
async function importData(e){try{const file=e.target.files[0];if(!file)return;if(file.size>10000000)throw Error();const obj=JSON.parse(await file.text());if(obj.version!==1||!validImport(obj.data))throw Error();if(!confirm('Remplacer les données actuelles par cette sauvegarde ?'))return;state=obj.data;save();render();toast('Sauvegarde restaurée')}catch{toast('Fichier invalide : choisis une sauvegarde Power & Glam Control.')}}
$('#date').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'Europe/Paris'});window.addEventListener('hashchange',render);render();
</script></body></html>
